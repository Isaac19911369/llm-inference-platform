# Example: NIM Llama 3.1 70B with tensor parallelism 4 on H100 80GB (see capacity plan).
engine: nim
model:
  servedName: meta/llama-3.1-70b-instruct
  maxModelLen: 8192
  tensorParallel: 4
  # pin the TP4 profile id printed by `list-model-profiles` in the NIM container
  nimProfile: ""
images:
  nim:
    repository: nvcr.io/nim/meta/llama-3.1-70b-instruct
    tag: "1.3.3"
resources:
  limits: { nvidia.com/gpu: 4, memory: 320Gi }
  requests: { cpu: "16", memory: 200Gi }
modelCache:
  size: 300Gi
shmSize: 32Gi
nodeSelector:
  nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
