{{- if .Values.modelCache.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "llm.fullname" . }}-cache
  labels:
    {{- include "llm.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # do not delete downloaded weights on uninstall
spec:
  accessModes: [{{ .Values.modelCache.accessMode }}]
  {{- with .Values.modelCache.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.modelCache.size }}
{{- end }}
