[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmplatform"
version = "0.1.0"
description = "Tooling for self-hosted LLM inference on Kubernetes: GPU capacity planner, OpenAI-compatible load tester, LLM server simulator."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Eshagh Dehmollaian" }]
dependencies = ["httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29", "numpy>=1.24"]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=8", "ruff>=0.5", "pyyaml>=6.0"]

[project.scripts]
llmplat = "llmplatform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
